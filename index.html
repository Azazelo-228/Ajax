<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Пользователи</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        color: #1f2328;
        background: #fff;
        font-family: Arial, sans-serif;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 24px;
        font-weight: 500;
      }

      .users {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px 24px;
        max-width: 1100px;
      }

      .button {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        min-height: 96px;
        padding: 8px 12px;
        border: 1px solid #eaeef2;
        border-radius: 12px;
        color: inherit;
        background: #fff;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .button:hover {
        transform: translateY(-3px);
        border-color: #d0d7de;
        background: #fff;
        box-shadow: 0 8px 20px rgb(31 35 40 / 10%);
      }

      .button:hover .avatar {
        transform: scale(1.06) rotate(-3deg);
      }

      .button:focus-visible {
        outline: 3px solid #0969da;
        outline-offset: 2px;
      }

      .avatar {
        position: relative;
        overflow: hidden;
        display: grid;
        flex: 0 0 80px;
        width: 80px;
        height: 80px;
        place-items: center;
        border-radius: 18px;
        color: #fff;
        background: linear-gradient(
          145deg,
          var(--avatar-light),
          var(--avatar-dark)
        );
        box-shadow:
          inset 0 1px 1px rgb(255 255 255 / 35%),
          0 5px 12px color-mix(in srgb, var(--avatar-dark) 25%, transparent);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -1px;
        text-shadow: 0 1px 3px rgb(0 0 0 / 20%);
        transition: transform 180ms ease;
      }

      .avatar::before,
      .avatar::after {
        position: absolute;
        border-radius: 50%;
        background: rgb(255 255 255 / 16%);
        content: "";
        pointer-events: none;
      }

      .avatar::before {
        top: -18px;
        right: -12px;
        width: 54px;
        height: 54px;
      }

      .avatar::after {
        bottom: -27px;
        left: -18px;
        width: 64px;
        height: 64px;
      }

      .avatar {
        isolation: isolate;
      }

      .avatar::before,
      .avatar::after {
        z-index: -1;
      }

      .button:nth-child(6n + 1) .avatar {
        --avatar-light: #a78bfa;
        --avatar-dark: #6d28d9;
      }

      .button:nth-child(6n + 2) .avatar {
        --avatar-light: #60a5fa;
        --avatar-dark: #1d4ed8;
      }

      .button:nth-child(6n + 3) .avatar {
        --avatar-light: #34d399;
        --avatar-dark: #047857;
      }

      .button:nth-child(6n + 4) .avatar {
        --avatar-light: #fb7185;
        --avatar-dark: #be123c;
      }

      .button:nth-child(6n + 5) .avatar {
        --avatar-light: #fbbf24;
        --avatar-dark: #c2410c;
      }

      .button:nth-child(6n) .avatar {
        --avatar-light: #22d3ee;
        --avatar-dark: #0e7490;
      }

      @media (prefers-reduced-motion: reduce) {
        .button,
        .avatar {
          transition: none;
        }
      }

      @media (max-width: 800px) {
        .users {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 16px;
        }

        .users {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Пользователи</h1>
      <section class="users" aria-label="Список пользователей">
        <button class="button" type="button" data-user="1">
          <span class="avatar">1</span><span data-user="1">user-1</span>
        </button>
        <button class="button" type="button" data-user="2">
          <span class="avatar">2</span><span data-user="2">user-2</span>
        </button>
        <button class="button" type="button" data-user="3">
          <span class="avatar">3</span><span data-user="3">user-3</span>
        </button>
        <button class="button" type="button" data-user="4">
          <span class="avatar">4</span><span data-user="4">user-4</span>
        </button>
        <button class="button" type="button" data-user="5">
          <span class="avatar">5</span><span data-user="5">user-5</span>
        </button>
        <button class="button" type="button" data-user="6">
          <span class="avatar">6</span><span data-user="6">user-6</span>
        </button>
        <button class="button" type="button" data-user="7">
          <span class="avatar">7</span><span data-user="7">user-7</span>
        </button>
        <button class="button" type="button" data-user="8">
          <span class="avatar">8</span><span data-user="8">user-8</span>
        </button>
        <button class="button" type="button" data-user="9">
          <span class="avatar">9</span><span data-user="9">user-9</span>
        </button>
        <button class="button" type="button" data-user="10">
          <span class="avatar">10</span><span data-user="10">user-10</span>
        </button>
      </section>
    </main>
    <script src="./scripts/script.js"></script>
  </body>
</html>
