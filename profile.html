<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Профиль пользователя</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 24px;
        color: #1f2328;
        background: #f6f8fa;
        font-family: Arial, sans-serif;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        padding: 10px 14px;
        border: 1px solid #d0d7de;
        border-radius: 10px;
        color: #1f2328;
        background: #fff;
        font: inherit;
        text-decoration: none;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .back-button:hover {
        transform: translateX(-2px);
        background: #f1f3f5;
      }

      .back-button:focus-visible {
        outline: 3px solid #0969da;
        outline-offset: 2px;
      }

      .profile {
        width: min(100%, 720px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #e1e5e9;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(31 35 40 / 8%);
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 20px;
        min-height: 190px;
        padding: 32px;
        color: #fff;
        background: linear-gradient(125deg, #4f46e5, #9333ea);
      }

      .avatar {
        display: grid;
        flex: 0 0 96px;
        width: 96px;
        height: 96px;
        place-items: center;
        border: 3px solid rgb(255 255 255 / 75%);
        border-radius: 28px;
        background: rgb(255 255 255 / 20%);
        font-size: 34px;
        font-weight: 700;
      }

      .profile-title {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .profile-subtitle {
        margin: 0;
        color: rgb(255 255 255 / 80%);
        font-size: 15px;
      }

      .profile-info {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 24px;
      }

      .info-item {
        min-width: 0;
        padding: 16px;
        border: 1px solid #eaeef2;
        border-radius: 12px;
        background: #fff;
      }

      .info-label {
        display: block;
        margin-bottom: 8px;
        color: #656d76;
        font-size: 13px;
      }

      .info-value {
        overflow-wrap: anywhere;
        font-size: 16px;
        font-weight: 600;
      }

      @media (max-width: 520px) {
        body {
          padding: 24px 16px;
        }

        .profile-header {
          min-height: 160px;
          padding: 24px;
        }

        .avatar {
          flex-basis: 76px;
          width: 76px;
          height: 76px;
          border-radius: 22px;
          font-size: 28px;
        }

        .profile-title {
          font-size: 23px;
        }

        .profile-info {
          grid-template-columns: 1fr;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <a class="back-button" href="./index.html" aria-label="Назад к списку пользователей">
      <span aria-hidden="true">←</span>
      Назад
    </a>
    <main class="profile">
      <header class="profile-header">
        <div class="avatar" aria-hidden="true">U</div>
        <div>
          <h1 class="profile-title">Профиль <span class="name"></span></h1>
          <p class="profile-subtitle">Информация о пользователе</p>
        </div>
      </header>

      <section class="profile-info" aria-label="Информация о пользователе">
        <div class="info-item">
          <span class="info-label">Username</span>
          <div class="username">...</div>
        </div>
        <div class="info-item">
          <span class="info-label">Phone</span>
          <div class="phone">...</div>
        </div>
        <div class="info-item">
          <span class="info-label">Company</span>
          <div class="company">...</div>
        </div>
        <div class="info-item">
          <span class="info-label">Website</span>
          <div class="website">...</div>
        </div>
        <div class="info-item">
          <span class="info-label">Email</span>
          <div class="email">...</div>
        </div>
      </section>
    </main>
    <script src="./scripts/prof.js"></script>
  </script>
  </body>
</html>
